<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Cyan to Green Gradient for the HUD look -->
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <!-- Glow filter for HUD elements -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient target circle -->
  <circle cx="16" cy="16" r="11" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" />

  <!-- Outer corner brackets for target lock -->
  <path d="M 11 5 A 12 12 0 0 1 21 5" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 11 27 A 12 12 0 0 0 21 27" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  
  <path d="M 5 11 A 12 12 0 0 0 5 21" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 27 11 A 12 12 0 0 1 27 21" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central glowing dot -->
  <circle cx="16" cy="16" r="1" fill="#00f0ff" filter="url(#glow)" />

  <!-- Sharp, tactical letter 'X' -->
  <path d="M 12 12 L 20 20" stroke="url(#cyanGreenGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 20 12 L 12 20" stroke="url(#cyanGreenGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
</svg>